publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  firebase_core: ^2.27.0
  firebase_database: ^10.4.0
  http: ^1.2.0
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  fl_chart: ^0.66.2
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
